services:
  server:
    build: .
    restart: unless-stopped
    user: "${MINIOJ_UID:-1000}:${MINIOJ_GID:-1000}"
    command: uvicorn minioj.server.main:app --host 0.0.0.0 --port 8000
    environment:
      MINIOJ_DATABASE_URL: sqlite:////app/database/oj.db
      MINIOJ_DATA_DIR: /app/data
      MINIOJ_JOB_DIR: /app/data/jobs
      MINIOJ_DOCKER_IMAGE: ${MINIOJ_DOCKER_IMAGE:-minioj-cpp20:latest}
      MINIOJ_FEEDBACK_POLICY: ${MINIOJ_FEEDBACK_POLICY:-full}
      MINIOJ_ROOT_PATH: /minioj
      MINIOJ_SESSION_HTTPS_ONLY: ${MINIOJ_SESSION_HTTPS_ONLY:-false}
      MINIOJ_SOURCE_LIMIT_BYTES: ${MINIOJ_SOURCE_LIMIT_BYTES:-262144}
      MINIOJ_STDIN_LIMIT_BYTES: ${MINIOJ_STDIN_LIMIT_BYTES:-262144}
      MINIOJ_OUTPUT_LIMIT_BYTES: ${MINIOJ_OUTPUT_LIMIT_BYTES:-8388608}
      MINIOJ_COMPILE_TIME_LIMIT_MS: ${MINIOJ_COMPILE_TIME_LIMIT_MS:-30000}
      MINIOJ_COMPILE_MEMORY_MB: ${MINIOJ_COMPILE_MEMORY_MB:-512}
      MINIOJ_CHECKER_TIME_LIMIT_MS: ${MINIOJ_CHECKER_TIME_LIMIT_MS:-10000}
      MINIOJ_CHECKER_MEMORY_MB: ${MINIOJ_CHECKER_MEMORY_MB:-512}
      MINIOJ_TESTCASE_FILE_LIMIT_BYTES: ${MINIOJ_TESTCASE_FILE_LIMIT_BYTES:-16777216}
      MINIOJ_TESTCASE_BUILD_TIME_LIMIT_MS: ${MINIOJ_TESTCASE_BUILD_TIME_LIMIT_MS:-10000}
      MINIOJ_TESTCASE_BUILD_MEMORY_MB: ${MINIOJ_TESTCASE_BUILD_MEMORY_MB:-512}
      MINIOJ_GENERATOR_MAX_CASES: ${MINIOJ_GENERATOR_MAX_CASES:-50}
      MINIOJ_TOKEN_DEFAULT_DAYS: ${MINIOJ_TOKEN_DEFAULT_DAYS:-90}
      MINIOJ_MAX_QUEUED_SUBMISSIONS: ${MINIOJ_MAX_QUEUED_SUBMISSIONS:-1000}
      MINIOJ_MAX_QUEUED_RUNS: ${MINIOJ_MAX_QUEUED_RUNS:-16}
      MINIOJ_CUSTOM_RUN_WAIT_SECONDS: ${MINIOJ_CUSTOM_RUN_WAIT_SECONDS:-45}
      MINIOJ_OVERLOAD_RETRY_AFTER_SECONDS: ${MINIOJ_OVERLOAD_RETRY_AFTER_SECONDS:-2}
      MINIOJ_POLYGON_ARCHIVE_LIMIT_BYTES: ${MINIOJ_POLYGON_ARCHIVE_LIMIT_BYTES:-67108864}
      MINIOJ_POLYGON_EXPANDED_LIMIT_BYTES: ${MINIOJ_POLYGON_EXPANDED_LIMIT_BYTES:-268435456}
      MINIOJ_ADMIN_USERNAME: ${MINIOJ_ADMIN_USERNAME:-}
      MINIOJ_ADMIN_EMAIL: ${MINIOJ_ADMIN_EMAIL:-}
      MINIOJ_ADMIN_PASSWORD: ${MINIOJ_ADMIN_PASSWORD:-}
      MINIOJ_SECRET_KEY: ${MINIOJ_SECRET_KEY:?Set MINIOJ_SECRET_KEY in .env}
    expose:
      - "8000"
    volumes:
      - ${MINIOJ_DATABASE_DIR:-./database}:/app/database
      - ${MINIOJ_DATA_HOST_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${MINIOJ_HTTP_BIND:-100.95.57.121}:${MINIOJ_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/minioj/"]
      interval: 10s
      timeout: 3s
      retries: 3
