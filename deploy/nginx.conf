events {}

http {
    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        location = / {
            return 302 /minioj/;
        }

        location = /minioj {
            return 308 /minioj/;
        }

        location /minioj/ {
            # Preserve /minioj/ because Starlette's mounted /static route uses
            # root_path when matching. FastAPI's ordinary routes accept it too.
            proxy_pass http://server:8000;
            proxy_http_version 1.1;

            # Preserve a non-default external port so url_for() generates
            # reachable absolute static-asset URLs in isolated deployments.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /minioj;

            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Match the API's 2 x 16 MiB testcase files, worst-case JSON escaping
        # (6 bytes per byte) plus its 64 KiB envelope. The server still checks
        # each decoded file and enforces the configured, smaller limits.
        location ~ ^/minioj/api/v1/admin/problems/[A-Za-z0-9-]+/testcases(?:/[0-9]+)?$ {
            client_max_body_size 193m;
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /minioj;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /minioj/admin/problems/import {
            client_max_body_size 65m;
            proxy_pass http://server:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /minioj/manage/problems/import {
            client_max_body_size 65m;
            proxy_pass http://server:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            return 404;
        }
    }
}
