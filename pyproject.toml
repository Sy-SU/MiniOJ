[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minioj"
version = "0.1.0"
description = "A lightweight, agent-friendly online judge for WSL and Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16,<1",
]

[project.scripts]
minioj = "minioj.cli:main"
minioj-worker = "minioj.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minioj"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "minioj/templates"
"static" = "minioj/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["minioj"]

[tool.ruff.lint]
# FastAPI intentionally evaluates Depends() and Header() in parameter defaults.
ignore = ["B008"]

